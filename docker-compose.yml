services:
  mysql:
    image: mysql:8.0
    container_name: mysql-deadline
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: app
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_pass
    ports:
      - "3306:3306"
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/1-schema.sql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: eclipse-temurin:11-jre
    container_name: app-deadline
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./app-deadline.jar:/app/app-deadline.jar
    environment:
      DB_URL: jdbc:mysql://mysql:3306/app?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_USER: app_user
      DB_PASS: app_pass
    command: java -jar /app/app-deadline.jar
    ports:
      - "9999:9999"
    restart: unless-stopped